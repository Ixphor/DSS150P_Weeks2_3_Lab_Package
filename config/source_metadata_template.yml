---
source_name: "api_events"
source_type: "REST API"
location_or_endpoint: "http://127.0.0.1:8000/api/events"
owner: "Platform Team"
description: "Paginated stream of system events"
record_count: "Dynamic (Unknown until fully paginated)"
schema: 
  - event_id: string
  - updated_at: string (logical timestamp)
  - amount: float
  - metadata: object (nested dictionary)
primary_or_candidate_key: "event_id"
update_pattern: "Incremental"
known_quality_issues: 
  - "Intentionally contains duplicate event_id values"
acquisition_method: "Paginated GET requests"
validation_checks: 
  - "event_id must be present"
  - "updated_at must be a valid timestamp"

---
source_name: "support_tickets"
source_type: "PostgreSQL Table"
location_or_endpoint: "dss150p.public.support_tickets"
owner: "Customer Support"
description: "Operational support ticket records"
record_count: "250"
schema: 
  - ticket_id: integer
  - customer_id: varchar(10)
  - category: varchar(40)
  - priority: varchar(10)
  - assigned_agent: varchar(80)
  - opened_at: timestamp
  - resolved_at: timestamp
  - status: varchar(20)
primary_or_candidate_key: "ticket_id"
update_pattern: "Incremental / CDC"
known_quality_issues: 
  - "4 tickets have a null assigned_agent"
acquisition_method: "Inspection only (in this lab)"
validation_checks: 
  - "ticket_id must be unique and not null"
  - "opened_at must be less than or equal to resolved_at"