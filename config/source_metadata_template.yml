---
source_name: "customers"
source_type: "CSV"
location_or_endpoint: "data/customers.csv"
owner: "Data Engineering"
description: "Customer demographic and segmentation data"
record_count: "250"
schema: 
  - customer_id: string
  - first_name: string
  - last_name: string
  - email: string
  - city: string
  - signup_date: string (logical date)
  - customer_segment: string
primary_or_candidate_key: "customer_id"
update_pattern: "Batch Full Load"
known_quality_issues: 
  - "2 exact duplicate rows"
  - "customer_id is not unique"
  - "3 missing email values"
  - "2 missing city values"
acquisition_method: "File copy + manifest"
validation_checks: 
  - "customer_id must be unique and non-null"
  - "email must be formatted correctly if present"
  - "signup_date must not be in the future"

---
source_name: "orders"
source_type: "JSON"
location_or_endpoint: "data/orders.json"
owner: "Sales Operations"
description: "Customer order transactions with nested shipping information"
record_count: "250"
schema: 
  - order_id: integer
  - customer_id: string
  - order_timestamp: string (logical timestamp)
  - status: string
  - item_count: integer
  - subtotal: float
  - shipping_fee: float
  - total_amount: float
  - shipping: object (nested dictionary)
primary_or_candidate_key: "order_id"
update_pattern: "Batch Incremental"
known_quality_issues: []
acquisition_method: "File copy + manifest"
validation_checks: 
  - "order_id must be unique and non-null"
  - "total_amount should equal subtotal plus shipping_fee"

